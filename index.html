<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaos &amp; Control — Check-In</title>
<meta name="description" content="Breckyn's workout clock-in: photo proof, streaks, steps, fuel and skills. No location tracking.">
<meta name="theme-color" content="#0B0B12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<!-- iPhone home screen -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C&amp;C Check-In">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="fonts/BarlowCondensed-ExtraBold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- self-drawn suit / wildcard glyphs -->
    <symbol id="s-diamond" viewBox="0 0 24 24"><path d="M12 1 22 12 12 23 2 12Z" fill="currentColor"/></symbol>
    <symbol id="s-club" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="7" r="4.6"/><circle cx="6.6" cy="13.4" r="4.6"/><circle cx="17.4" cy="13.4" r="4.6"/><path d="M10.6 13h2.8l1.6 9H9z"/></g></symbol>
    <symbol id="s-spade" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1C9 6 3 9 3 14a4.6 4.6 0 0 0 7.6 3.5L9 23h6l-1.6-5.5A4.6 4.6 0 0 0 21 14c0-5-6-8-9-13Z"/></symbol>
    <symbol id="s-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22S2 15.4 2 8.6A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 10 2.6C22 15.4 12 22 12 22Z"/></symbol>
    <symbol id="s-wild" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0l2.6 8.2L23 6l-6 6.2 6 5.8-8.4-2.2L12 24l-2.6-8.2L1 18l6-5.8L1 6l8.4 2.2Z"/><text x="12" y="15.2" text-anchor="middle" font-size="9" font-weight="900" font-family="Arial" fill="#0B0B12">?</text></symbol>
    <symbol id="s-chev" viewBox="0 0 24 24"><path fill="currentColor" d="M2 4h7l8 8-8 8H2l8-8Z"/><path fill="currentColor" opacity=".55" d="M10 4h5l8 8-8 8h-5l8-8Z"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <img class="mark" src="icons/mark-128.png" width="40" height="40" alt="" aria-hidden="true">
    <div><h1>Chaos <span class="amp">&amp;</span> <span class="ctl">Control</span></h1><small>CHECK-IN · VOL. 01</small></div>
  </div>
  <button class="install-btn" id="installBtn" data-act="install" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 3v12M6 10l6 6 6-6M4 21h16"/></svg>ADD TO HOME SCREEN
  </button>
</header>

<main>
  <section class="view active" id="view-clock" aria-label="Clock in"></section>
  <section class="view" id="view-steps" aria-label="Steps"></section>
  <section class="view" id="view-fuel" aria-label="Food log"></section>
  <section class="view" id="view-skills" aria-label="Skills"></section>
  <section class="view" id="view-log" aria-label="History and stats"></section>
  <section class="view" id="view-more" aria-label="Settings and about"></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <button data-act="tab" data-tab="clock" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>CLOCK<span class="dot" id="liveDot" hidden></span></button>
  <button data-act="tab" data-tab="steps"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="7" rx="3" ry="4.6"/><ellipse cx="16" cy="12" rx="3" ry="4.6"/><rect x="5.4" y="13" width="5" height="3.2" rx="1.6"/><rect x="13.5" y="18" width="5" height="3.2" rx="1.6"/></svg>STEPS</button>
  <button data-act="tab" data-tab="fuel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M13 2 5 14h6l-1 8 8-12h-6Z" stroke-linejoin="round"/></svg>FUEL</button>
  <button data-act="tab" data-tab="skills"><svg viewBox="0 0 24 24"><use href="#s-wild"/></svg>SKILLS</button>
  <button data-act="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>LOG</button>
  <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M12 8l3 4-3 4-3-4Z" fill="currentColor"/></svg>MORE</button>
</nav>

<div class="sheet" id="sheet" aria-modal="true" role="dialog"><div class="back" data-act="closeSheet"></div><div class="panel"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>
<div class="burst" id="burst" aria-hidden="true"><div class="ringx"></div><div class="ringx"></div><div class="ringx"></div><div class="slam"><b id="burstTitle">CLOCKED IN</b><small id="burstSub"></small></div></div>
<div class="reveal" id="reveal"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<noscript><p style="padding:20px">This check-in app needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>
</body>
</html>
